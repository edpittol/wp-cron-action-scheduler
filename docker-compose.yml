services:
  wordpress:
    build:
      context: ./docker
      args:
        ACTION_SCHEDULER_VERSION: "4.0.0"
    ports:
      - "${STACK_PORT:-8080}:${STACK_PORT:-8080}"
    environment:
      STACK_PORT: "${STACK_PORT:-8080}"
    volumes:
      - wp-content:/var/www/html/wp-content

volumes:
  wp-content:
