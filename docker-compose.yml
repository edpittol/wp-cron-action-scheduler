services:
  php-fpm:
    build:
      context: ./docker
      # No `args:` here on purpose: PHP's version has exactly one source
      # of truth, the PHP_VERSION ARG default in docker/Dockerfile.
      # Overriding it here would let this file and the Dockerfile silently
      # disagree -- same discipline this file already applied to the
      # Action Scheduler version (now pinned via docker/composer.lock
      # instead of a build arg; see the Dockerfile's Composer step).
    environment:
      STACK_PORT: "${STACK_PORT:-8080}"
      # Issue #5: DISABLE_WP_CRON must be switchable without rebuilding
      # the image -- wp-config.php (docker/Dockerfile) reads this at
      # runtime via getenv(). `bin/stack set-disable-wp-cron <true|false>`
      # recreates just this container with a new value; see that
      # subcommand's own comment in bin/stack.
      WPCAS_DISABLE_WP_CRON: "${WPCAS_DISABLE_WP_CRON:-true}"
    volumes:
      # The whole document root as one named volume (issue #29): nginx
      # mounts the same volume read-only below so both services see the
      # identical, Composer-provisioned webroot the image was built with.
      # Per ADR-0002, this volume is populated once, on first start, from
      # whatever the image contains at that path -- a later image rebuild
      # (e.g. after bumping docker/composer.lock) does not reach an
      # already-existing volume; preflight is what catches that staleness
      # (see the version-assertion ticket), not this arrangement.
      - webroot:/var/www/html
      # Only the actual SQLite data file persists across `up`/`down`.
      # Everything else under wp-content (plugins, the db.php drop-in)
      # comes straight from the image (by way of the webroot volume
      # above), so rebuilding after a composer.lock bump takes effect on
      # the next `up` without needing a webroot volume wipe.
      - wp-database:/var/www/html/wp/wp-content/database
      # mu-plugins is bind-mounted, not baked in, so `bin/guard arm` can
      # add/remove guard files on the host and have WordPress see the
      # change on its very next request -- no rebuild, no restart.
      # docker/mu-plugins/ always contains the #1 probe mu-plugin plus
      # whichever of the four guard files (copied in from
      # docker/mu-plugins-available/, which is not itself mounted or
      # scanned by WordPress) are currently armed.
      - ./docker/mu-plugins:/var/www/html/wp/wp-content/mu-plugins
      # Issue #33: nginx's own access log, so measure-http.php (which runs
      # inside *this* container, via `wp eval-file`) can read the web
      # server's line for a request it just issued, and correlate it by
      # request id against PHP-FPM's own access log (local to this same
      # container -- no volume needed for that half). Read-only here: this
      # container never writes to nginx's log, only reads it back.
      - nginx-access-log:/var/log/wpcas-nginx:ro
      # Issue #30: the exact same file the nginx service below mounts as its
      # own fastcgi_read_timeout include, bind-mounted read-only into this
      # container too -- so a `wp eval-file` process running here
      # (docker/wp-cli/lib/probe.php's preflight fact-gathering) can read
      # nginx's own upstream-read-timeout value back from the identical
      # bytes nginx itself is running with, without a second, separately
      # maintained copy of that number that could silently drift out of
      # agreement with it. See docker/nginx/fastcgi-read-timeout.conf's own
      # comment for the full rationale.
      - ./docker/nginx/fastcgi-read-timeout.conf:/etc/wpcas/nginx-fastcgi-read-timeout.conf:ro

  nginx:
    # Single pinned tag: nginx's whole "build" is this one image, so this
    # is the only place its version can come from -- same discipline as
    # PHP_VERSION in docker/Dockerfile, just with no Dockerfile of its own
    # to duplicate the pin into.
    image: nginx:1.27-alpine
    depends_on:
      - php-fpm
    ports:
      - "${STACK_PORT:-8080}:80"
    volumes:
      # Read-only: nginx only ever serves existing files directly or hands
      # .php requests to php-fpm (docker/nginx/default.conf) -- it never
      # needs to write into the document root itself.
      - webroot:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Issue #33: writable side of the shared access-log volume above --
      # nginx is the only service that writes to it.
      - nginx-access-log:/var/log/wpcas-nginx
      # Issue #30: the fastcgi_read_timeout include default.conf's php
      # location block pulls in -- see that file and
      # docker/nginx/fastcgi-read-timeout.conf's own comments.
      - ./docker/nginx/fastcgi-read-timeout.conf:/etc/nginx/conf.d/fastcgi-read-timeout.conf:ro

volumes:
  webroot:
  wp-database:
  # Issue #33: not a bind mount, same reasoning as webroot/wp-database --
  # this only needs to be visible to both containers for the lifetime of
  # the stack, and (unlike mu-plugins) nothing on the host ever needs to
  # edit it directly.
  nginx-access-log:
