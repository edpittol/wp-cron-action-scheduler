# The FastCGI handling every PHP-serving location in
# docker/nginx/default.conf shares, factored out here so the generic
# `location ~ \.php$` and guard section 5's exact-match
# `location = /wp/wp-cron.php` (issue #36) cannot drift apart in how they
# hand a request to php-fpm. Without this, adding the cron entry point as
# its own exact-match location -- which nginx matches ahead of any regex
# location, so it must carry its own complete handling -- would mean two
# hand-maintained copies of the same six directives, and the cron entry
# point silently being served differently from every other .php file the
# day one copy changed.
#
# Mounted at /etc/wpcas/nginx-php-fastcgi.conf, NOT under
# /etc/nginx/conf.d/: everything in conf.d is included at `http` level by
# the base image's own nginx.conf, and these directives are only valid
# inside a `location`. (docker/nginx/fastcgi-read-timeout.conf can live in
# conf.d precisely because `fastcgi_read_timeout` IS valid at http level --
# see that file's own comment for why it is separate at all.)
try_files $uri =404;
include fastcgi_params;
# Issue #30: the upstream read timeout, pinned explicitly rather than left
# at nginx's own inherited default -- see that file's own comment for why
# it lives in its own include rather than inline here.
include /etc/nginx/conf.d/fastcgi-read-timeout.conf;
fastcgi_pass php-fpm:9000;
fastcgi_index index.php;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
