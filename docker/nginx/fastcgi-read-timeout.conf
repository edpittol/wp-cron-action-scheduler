# Issue #30: nginx's own upstream read timeout for the FastCGI connection to
# php-fpm -- how long nginx waits between successive reads from php-fpm
# before giving up on the response and closing that upstream connection
# itself. Left at nginx's own default (60s) this ceiling would still exist,
# just nowhere a reader could find it stated -- the same "implicit, not
# explicit" gap this ticket exists to close for the PHP-FPM-side ceilings
# pinned in docker/Dockerfile (pm.max_children, request_terminate_timeout,
# max_execution_time). Set here above PHP-FPM's own request_terminate_timeout
# (35s, docker/Dockerfile) so nginx does not give up on -- and close -- the
# upstream connection before FPM's own hard kill has had a chance to act and
# produce a response/log of its own.
#
# Split into its own file (rather than inlined directly into
# docker/nginx/default.conf's `location ~ \.php$` block) so this exact same
# file can be bind-mounted, read-only, into the php-fpm container too (see
# docker-compose.yml) -- docker/wp-cli/lib/probe.php reads this file's own
# bytes back to carry this value into every preflight snapshot and therefore
# every result record, rather than repeating "40" as a second, separate
# literal that could silently drift out of agreement with what nginx is
# actually enforcing.
fastcgi_read_timeout 40;
