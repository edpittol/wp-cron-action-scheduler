# nginx's own replacement for the deleted docker/router.php (issue #29 /
# ADR-0001): reproduces the same try_files semantics that router.php
# emulated for PHP's built-in server, now natively, against the
# Composer-provisioned webroot's actual layout -- core (and its front
# controller) live under /wp, while the document root itself stays at the
# site root so home_url() resolves unprefixed.
#
# Issue #32 closes the gap router.php's own docstring documented against
# itself: dotfiles under the document root -- including the SQLite data
# file this stack keeps at wp/wp-content/database/.ht.sqlite -- are now
# refused, alongside the vendor/manifest exposure Composer provisioning
# (issue #29) introduced (composer.json/composer.lock and vendor/, both at
# the document root). See the deny rules below, ahead of the `location /`
# and `\.php$` blocks.
#
# Listens on a fixed, container-internal port 80: docker-compose.yml maps
# the per-checkout `${STACK_PORT}` (published to the host) onto this one,
# fixed container port, the same way any other Compose service would.
# docker/wp-cli/measure-http.php and friends, which loop back into this
# stack from *inside* the php-fpm container (a separate service, with its
# own network namespace), reach nginx by its Compose service name (below)
# rather than this port number -- see those scripts' own comments for why
# WP_HOME/WP_SITEURL (docker/Dockerfile) staying "localhost:$STACK_PORT"
# and this container-internal loopback are two different addresses for
# the same site.
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Issue #32: Composer's dependency manifests, at the document root
    # only -- exact match, so this is scoped to those two literal files
    # rather than any path that happens to end the same way.
    location = /composer.json {
        deny all;
    }

    location = /composer.lock {
        deny all;
    }

    # Issue #32: the vendor/ directory Composer installs at the document
    # root. `^~` stops nginx from falling through to the regex locations
    # below (in particular `\.php$`) for anything under this prefix, so a
    # directly-requested .php file inside a dependency's own source tree
    # is refused rather than executed -- not just listed.
    location ^~ /vendor/ {
        deny all;
    }

    # Issue #32: dotfiles anywhere under the document root, including
    # nested ones such as wp/wp-content/database/.ht.sqlite -- the SQLite
    # data file the retired router.php named as downloadable. `/\.`
    # matches a dot immediately after a path separator, so it does not
    # catch ordinary filenames that merely contain a dot (style.css,
    # wp-cron.php, admin-ajax.php, ...), and it is listed ahead of the
    # `\.php$` location below so a hypothetical dotfile ending in .php is
    # still refused rather than executed.
    location ~ /\. {
        deny all;
    }

    # Deliberately no `$uri/` fallback here: the deleted router.php only
    # ever checked is_file() (never is_dir()), so an existing *directory*
    # with no matching file fell through to the front controller exactly
    # like a non-existent path did. `$uri/` would instead trigger nginx's
    # own directory-index handling (looking for `index index.php` inside
    # that directory), which 403s here since there is no index.php at the
    # document root any more -- it lives under /wp.
    location / {
        try_files $uri /wp/index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Issue #30: the upstream read timeout, pinned explicitly rather
        # than left at nginx's own inherited default -- see that file's own
        # comment for why it lives here as its own include rather than a
        # directive inlined into this block.
        include /etc/nginx/conf.d/fastcgi-read-timeout.conf;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
