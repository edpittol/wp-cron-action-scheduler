# nginx's own replacement for the deleted docker/router.php (issue #29 /
# ADR-0001): reproduces the same try_files semantics that router.php
# emulated for PHP's built-in server, now natively, against the
# Composer-provisioned webroot's actual layout -- core (and its front
# controller) live under /wp, while the document root itself stays at the
# site root so home_url() resolves unprefixed.
#
# Known gap, carried over unchanged from router.php's own docstring: there
# is no `location ~ /\.` (or equivalent) deny rule here, so an existing
# dotfile under the document root -- including the SQLite data file this
# stack keeps at wp/wp-content/database/.ht.sqlite -- is not explicitly
# blocked from being served as static content the way a production nginx
# config normally would. Acceptable for a localhost-only PoC; see issue
# #32 for closing this gap (and the vendor/manifest exposure Composer
# provisioning introduces) deliberately, as its own change.
#
# Listens on a fixed, container-internal port 80: docker-compose.yml maps
# the per-checkout `${STACK_PORT}` (published to the host) onto this one,
# fixed container port, the same way any other Compose service would.
# docker/wp-cli/measure-http.php and friends, which loop back into this
# stack from *inside* the php-fpm container (a separate service, with its
# own network namespace), reach nginx by its Compose service name (below)
# rather than this port number -- see those scripts' own comments for why
# WP_HOME/WP_SITEURL (docker/Dockerfile) staying "localhost:$STACK_PORT"
# and this container-internal loopback are two different addresses for
# the same site.
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Deliberately no `$uri/` fallback here: the deleted router.php only
    # ever checked is_file() (never is_dir()), so an existing *directory*
    # with no matching file fell through to the front controller exactly
    # like a non-existent path did. `$uri/` would instead trigger nginx's
    # own directory-index handling (looking for `index index.php` inside
    # that directory), which 403s here since there is no index.php at the
    # document root any more -- it lives under /wp.
    location / {
        try_files $uri /wp/index.php$is_args$args;
    }

    # Guard section 5 (issue #36 / ADR-0003): blocks the cron entry point
    # before PHP ever bootstraps -- the only layer that can produce an
    # **observable status** for that block, since core's wp-cron.php calls
    # fastcgi_finish_request() (issue #29 / ADR-0001) before section 1's
    # in-PHP guard ever runs, closing the response to the client as an
    # already-sent 200 first. Armed the same way every other section is --
    # `bin/guard arm 5` copies a presence-only marker file
    # (docker/mu-plugins-available/50-block-cron-entry-nginx.marker) into
    # docker/nginx/guard/ (bind-mounted read-only into this container by
    # docker-compose.yml); `if (-f ...)` below stats it fresh on every
    # single request -- no nginx reload, no restart, and no second arming
    # mechanism alongside the one bin/guard already drives for every other
    # section.
    #
    # `location =` is an exact match, checked before -- and, once matched,
    # skipping entirely -- the generic `location ~ \.php$` block below, so
    # this is what decides this one path's fate, not the shared fastcgi
    # handler. WP-CLI's own cron/queue-runner commands never pass through
    # nginx at all (they run in-process against the wordpress container),
    # so this is scoped away from WP-CLI by construction, not by a PHP_SAPI
    # runtime check the way section 1 has to be.
    #
    # Unconditional: nginx cannot read the DISABLE_WP_CRON PHP constant, so
    # -- unlike section 1 -- this block cannot honour the fleet caveat; see
    # ADR-0003 and this ticket's own counter-example scenario.
    location = /wp/wp-cron.php {
        if (-f /etc/nginx/guard/50-block-cron-entry-nginx.marker) {
            return 403;
        }

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
