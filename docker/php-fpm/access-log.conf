; Issue #33: the process manager's (PHP-FPM's) own access log, disabled by
; default in the base php:8.3-fpm-bookworm image (`access.log`/`access.format`
; ship commented out in /usr/local/etc/php-fpm.d/www.conf -- both live under
; the same `[www]` pool section this file re-declares). Copied into
; /usr/local/etc/php-fpm.d/ (docker/Dockerfile) as a file sorted after
; www.conf, so PHP-FPM's pool-config merge (later file wins for a key
; already set on the same pool name) only overrides these two directives --
; everything else www.conf already set (listen, user, group, ...) is
; untouched.
;
; Written to /var/log/wpcas/ -- the same directory issue #6's canary guard
; already writes php-error.log to (docker/Dockerfile), created there and
; already confirmed writable by that ticket's own tooling.
;
; access.format: the base image's own shipped default already contains the
; %s status placeholder (`"%R - %u %t \"%m %r%Q%q\" %s %f %{milli}d %{kilo}M %C%%"`,
; see www.conf's commented-out default) -- this repo's own format keeps
; that %s and adds %{HTTP_X_WPCAS_REQUEST_ID}e ahead of it: PHP-FPM's `%e`
; token reads any CGI-style environment variable, and nginx's fastcgi_params
; (docker/nginx/default.conf) passes every incoming HTTP header through to
; PHP-FPM this way (X-Wpcas-Request-Id -> HTTP_X_WPCAS_REQUEST_ID), the same
; convention $_SERVER['HTTP_...'] already relies on in PHP itself. A
; request that never sent the header renders as an empty value here, which
; docker/wp-cli/lib/correlation.php's parser treats as "no id to join on" --
; same as nginx's own "-" placeholder for the equivalent case in its
; `wpcas` log_format (docker/nginx/default.conf).
[www]
access.log = /var/log/wpcas/php-fpm-access.log
access.format = "request_id=%{HTTP_X_WPCAS_REQUEST_ID}e status=%s time=%{%Y-%m-%dT%H:%M:%S%z}t"
